article{background:var(--card);border-radius:20px;padding:22px 18px;border:1px solid var(--line)}
h1{font-size:1.45rem;line-height:1.45;margin:0 0 10px}
.date{font-size:.78rem;color:var(--soft);margin-bottom:16px}
h2{font-size:1.15rem;margin:30px 0 10px;padding-left:10px;border-left:5px solid var(--sun);line-height:1.5}

.point{background:rgba(242,181,58,.13);border-radius:14px;padding:14px 16px;margin:16px 0}

.tbl{overflow-x:auto}
.cta{display:block;text-align:center;background:var(--ink);color:var(--card);text-decoration:none;font-weight:800;border-radius:16px;padding:16px;margin:24px 0 8px}
.cta small{display:block;font-weight:500;opacity:.8;font-size:.78rem;margin-top:4px}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
summary{font-weight:700;cursor:pointer}
details p{margin:8px 0 0}
.note{font-size:.78rem;color:var(--soft);margin-top:20px}
