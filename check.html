<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>とめれん帳 チェック</title>
<style>body{font-family:-apple-system,"Hiragino Sans",sans-serif;background:#1E2340;color:#F4F1EA;margin:0;padding:20px}button{width:100%;padding:16px;border:0;border-radius:14px;background:#F2B53A;color:#1E2340;font-size:1.05rem;font-weight:800;margin:10px 0}textarea{width:100%;height:220px;border-radius:12px;padding:10px;box-sizing:border-box;font-size:12px}p{line-height:1.7}</style></head>
<body>
<h2>とめれん帳 チェック用ページ</h2>
<p>このページは、とめれん帳が開かない原因をさがすためのものです。記録を消したり変えたりはしません。</p>
<button id="cp">① 中身をコピーする</button>
<p id="msg"></p>
<textarea id="out" readonly></textarea>
<script>
(function(){
  var SECRET=/member|adminkey|secret|token/i, out={};
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i), v=localStorage.getItem(k)||'';
      if(SECRET.test(k)){ out[k]='(ひみつのため省略・長さ'+v.length+')'; continue; }
      out[k]= v.length>1500 ? v.slice(0,1500)+'…(長さ'+v.length+')' : v;
    }
  }catch(e){ out.__error=String(e); }
  out.__ua=navigator.userAgent;
  var txt=JSON.stringify(out,null,1);
  document.getElementById('out').value=txt;
  document.getElementById('cp').onclick=function(){
    var ta=document.getElementById('out'); ta.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(function(){ document.getElementById('msg').textContent='コピーできたよ！チャットに貼って送ってね'; },function(){}); }
    document.getElementById('msg').textContent= ok?'コピーできたよ！チャットに貼って送ってね':'下の文字を長押しで全部えらんでコピーしてね';
  };
})();
</script>
</body></html>
